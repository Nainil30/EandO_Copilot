name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    name: Lint + unit tests (offline, fake LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check app tests evals scripts
      - run: pytest -q

  integration:
    name: Integration (Postgres + full pipeline + eval gate)
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eando_copilot
          POSTGRES_USER: copilot_user
          POSTGRES_PASSWORD: dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot_user -d eando_copilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_PROVIDER: fake
      DATABASE_URL: postgresql+psycopg2://copilot_user:dev_password@localhost:5432/eando_copilot
      READONLY_DATABASE_URL: postgresql+psycopg2://copilot_readonly:readonly_password@localhost:5432/eando_copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Bootstrap schema, data and KB
        run: python -m scripts.bootstrap
      - name: Read-only role really is read-only
        run: |
          python - <<'EOF'
          from sqlalchemy import create_engine, text
          import os
          eng = create_engine(os.environ["READONLY_DATABASE_URL"])
          with eng.connect() as c:
              try:
                  c.execute(text("DELETE FROM dim_part"))
                  raise SystemExit("write succeeded on read-only role!")
              except Exception as e:
                  print("blocked as expected:", type(e).__name__)
          EOF
      - name: Offline eval run (fake LLM - checks plumbing, guardrails and metrics)
        run: python -m evals.run_evals
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t eando-copilot:ci .
