[project]
name = "eando-copilot"
version = "2.0.0"
description = "Agentic RAG text-to-SQL copilot for Excess & Obsolete (E&O) inventory analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
