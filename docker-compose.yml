# Local stack:
#   docker compose up -d postgres                       # just the DB (dev with local venv)
#   docker compose --profile setup run --rm seed        # schema + data + knowledge base
#   docker compose up -d --build                        # postgres + api + ui
services:
  postgres:
    image: postgres:15-alpine
    container_name: eando_postgres
    environment:
      POSTGRES_DB: eando_copilot
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d eando_copilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: eando_api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://copilot_user:dev_password@postgres:5432/eando_copilot
      READONLY_DATABASE_URL: postgresql+psycopg2://copilot_readonly:readonly_password@postgres:5432/eando_copilot
      CHROMA_DIR: /app/.chroma
    ports:
      - "8000:8000"
    volumes:
      - kb_data:/app/.chroma
      - logs:/app/.logs
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    container_name: eando_ui
    command: ["streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      EANDO_API_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8501/_stcore/health || exit 1"]
    depends_on:
      - api

  seed:
    build: .
    profiles: ["setup"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://copilot_user:dev_password@postgres:5432/eando_copilot
      CHROMA_DIR: /app/.chroma
    command: ["python", "-m", "scripts.bootstrap"]
    volumes:
      - kb_data:/app/.chroma
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  kb_data:
  logs:
