# Replace placeholder values with: echo -n 'yourvalue' | base64
#
# base64 is encoding, NOT encryption: anyone who can read this Secret can decode it.
# That is why this file holds placeholders only and real values never go into git.
# In production, use an external secret store (Vault, AWS Secrets Manager, Sealed Secrets).
#
# The values below are the same local-dev defaults as docker-compose.yml, so the stack
# works on minikube once GEMINI_API_KEY is set. "postgres" in the URLs is the Service name.
apiVersion: v1
kind: Secret
metadata:
  name: eando-secrets
  namespace: eando-copilot
type: Opaque
data:
  # your-gemini-api-key
  GEMINI_API_KEY: eW91ci1nZW1pbmktYXBpLWtleQ==
  # postgresql+psycopg2://copilot_user:dev_password@postgres:5432/eando_copilot  (owner, used by bootstrap)
  DATABASE_URL: cG9zdGdyZXNxbCtwc3ljb3BnMjovL2NvcGlsb3RfdXNlcjpkZXZfcGFzc3dvcmRAcG9zdGdyZXM6NTQzMi9lYW5kb19jb3BpbG90
  # postgresql+psycopg2://copilot_readonly:readonly_password@postgres:5432/eando_copilot  (runs LLM SQL)
  READONLY_DATABASE_URL: cG9zdGdyZXNxbCtwc3ljb3BnMjovL2NvcGlsb3RfcmVhZG9ubHk6cmVhZG9ubHlfcGFzc3dvcmRAcG9zdGdyZXM6NTQzMi9lYW5kb19jb3BpbG90
  # Read by the official postgres image on first start to create the database and owner.
  # Must match the user/password/db inside DATABASE_URL.
  POSTGRES_DB: ZWFuZG9fY29waWxvdA==        # eando_copilot
  POSTGRES_USER: Y29waWxvdF91c2Vy          # copilot_user
  POSTGRES_PASSWORD: ZGV2X3Bhc3N3b3Jk      # dev_password
